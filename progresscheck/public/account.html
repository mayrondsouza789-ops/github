<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | ProgressCheck</title><link rel="stylesheet" href="/app.css"></head><body><main style="max-width:480px;margin:10vh auto;padding:24px"><a class="brand" href="/workspace.html">ProgressCheck</a><h1 style="margin-top:32px">Your saved record</h1><p>Sign in to save photographs and check-ins securely and open them on another device. Guest records are kept separately in this browser.</p><form id="account-form" class="stack"><label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label><div class="actions"><button class="btn primary" type="submit" name="mode" value="signin">Sign in</button><button class="btn" type="submit" name="mode" value="signup">Create account</button></div></form><p id="account-status" role="status" aria-live="polite"></p><button id="signout" class="btn" type="button">Sign out of this browser</button><p><a href="/workspace.html">Return to workspace / guest demo</a></p><p class="small muted">Research demonstration with experimental image analysis and mock review. No clinical service.</p></main><script src="/account.js"></script></body></html>
