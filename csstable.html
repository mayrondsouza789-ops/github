<!DOCTYPE html>
<html>
<head>
  <style>
    table{
      width: 100%;
      border-collapse: collapse;
      margin: 20px auto;
    }

    th, td {
      border: 5px solid rgb(85, 39, 39);
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: blue;
    }

    tr:hover {
      background-color: #c4c9c9;
    }

    caption {
      caption-side: top;
      font-weight: bold;
      padding: 20px;
    }
  </style>
</head>
<body>

  <table>
    <caption>Student Grades</caption>
    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Grade</th>
    </tr>
    <tr>
      <td>71</td>
      <td>Mayron</td>
      <td>A+++++</td>
    </tr>
    <tr>
      <td>33</td>
      <td>Kaneera</td>
      <td>C</td>
    </tr>
    <tr>
      <td>22</td>
      <td>Denniz</td>
      <td>F</td>
    </tr>
  </table>

</body>
</html>
