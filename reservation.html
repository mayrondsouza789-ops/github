<!DOCTYPE html>
<html>
<head>
    <title>Reservation Form</title>
</head>
<body>

    <h2>Reservation Form</h2>

    <form>
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone"><br><br>

        <label for="date">Reservation Date:</label><br>
        <input type="date" id="date"><br><br>

        <label for="time">Reservation Time:</label><br>
        <input type="time" id="time"><br><br>

        <label for="guests">Number of Guests:</label><br>
        <input type="number" id="guests" min="1"><br><br>

        <label for="requests">Special Requests:</label><br>
        <textarea id="requests" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit Reservation">
    </form>

</body>
</html>
