<!DOCTYPE html>
<html>
    <head>
        <title>Inherited Explicitly</title>
        <style>
            body{
                font-family:Arial;
                 color: Darkgreen;
            }
            h1{
                font-size: 24px;
            }
            p{
                color: inherit;/*Explicitly inherits from body*/
            }
        </style>
    </head>
    <body>
        <p>This para inherits the font color from the body</p>
    </body>
</html>
