<!DOCTYPE html>
<html>
<head>
    <title>DEMO Program</title>

    <!-- Internal CSS -->
    <style>
        .internal-style{
            font-family: cursive, fantasy;
            color: green;
            font-size: 40px;
            padding: 30px;
            background-color: #e0ffe0;
            border: 2px solid brown;
        }
    </style>

    <!-- Link to External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Inline CSS -->

    <!-- Internal CSS -->
    <p class="internal-style">

    </p>

    <!-- External CSS -->
    <div class="external-style">
        This div is styled using External CSS.
    </div>

</body>
</html>
